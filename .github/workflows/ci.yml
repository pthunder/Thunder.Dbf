#        .-----.
#       /     /      ProjectThunder :: Thunder.Dbf
#      /     /__     Every push and pull request: build and test on all three
#     /__      /     operating systems, publish the Native AOT sample, pack the
#       /    /       NuGet packages and check them, then the editorial and
#      /   /         security gates.
#     /  /
#    //
#   '
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Thunder.Dbf.slnx
      - run: dotnet build Thunder.Dbf.slnx -c Release --no-restore
      - run: dotnet test Thunder.Dbf.slnx -c Release --no-build --logger "trx" --results-directory test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  native-aot:
    # What an iOS app does to the library: trim it and compile it ahead of time. The sample fails to
    # publish on any trim or AOT warning, then checks that a table it writes reads back the same.
    name: Native AOT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish samples/NativeAot -c Release -o artifacts/native-aot
      - run: artifacts/native-aot/NativeAot

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # The same pack and checks the release workflow runs, so a broken package shows up
      # in the pull request rather than on release day.
      - run: dotnet pack Thunder.Dbf.slnx -c Release -o artifacts
      - name: Check packages (README, icon, symbols, XML docs, CLI installs and runs)
        run: scripts/check-packages.sh artifacts

  editorial:
    name: Editorial and security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Editorial check (secrets, personal paths, banners, fixtures, stray data)
        run: scripts/editorial-check.sh
      - name: No known-vulnerable packages
        run: |
          dotnet restore Thunder.Dbf.slnx
          dotnet list Thunder.Dbf.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
