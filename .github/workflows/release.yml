#        .-----.
#       /     /      ProjectThunder :: Thunder.Dbf
#      /     /__     Pushing a tag vX.Y.Z releases that version:
#     /__      /       1. check the tag, <Version> and CHANGELOG agree; build, test, pack
#       /    /         2. publish the web service as self-contained zips, each on its own OS
#      /   /           3. push the packages to nuget.org (trusted publishing, no stored key)
#     /  /             4. create the GitHub release with the packages and zips
#    //
#   '                See "Releasing" in docs/maintainers/maintaining.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Tag matches <Version> in Directory.Build.props
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild src/Thunder.Dbf/Thunder.Dbf.csproj -getProperty:Version)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG doesn't match <Version>$version</Version> in Directory.Build.props. Bump the version or fix the tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG has a dated section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          heading=$(grep -m1 -F "## [$VERSION]" CHANGELOG.md || true)
          if [[ -z "$heading" ]]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          if [[ "$heading" == *Unreleased* ]]; then
            echo "::error::CHANGELOG.md still calls $VERSION 'Unreleased'. Give it the release date."
            exit 1
          fi
          # The section body, up to the next version heading, becomes the release notes.
          awk -v h="$heading" '$0 == h { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > release-notes.md

      - run: dotnet restore Thunder.Dbf.slnx
      - run: dotnet build Thunder.Dbf.slnx -c Release --no-restore
      - run: dotnet test Thunder.Dbf.slnx -c Release --no-build
      - run: dotnet pack Thunder.Dbf.slnx -c Release --no-build -o artifacts
      - name: Check packages (README, icon, symbols, XML docs, CLI installs and runs)
        run: scripts/check-packages.sh artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  server:
    name: Web service (${{ matrix.rid }})
    needs: build
    # Each runtime is published on its own OS: a macOS executable built elsewhere isn't
    # code-signed, and Apple silicon refuses to run it.
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RID: ${{ matrix.rid }}
      NAME: thunder-dbf-server-${{ needs.build.outputs.version }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Self-contained, so the server needs no .NET install; one executable plus appsettings.json.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Thunder.Dbf.Server/Thunder.Dbf.Server.csproj -c Release -r "$RID" \
            --self-contained true -p:PublishSingleFile=true -p:PublishReferencesDocumentationFiles=false \
            -o "publish/$NAME"
          cp LICENSE "publish/$NAME/LICENSE"
          cp src/Thunder.Dbf.Server/README.md "publish/$NAME/README.md"

      - name: Zip (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: publish
        # zip keeps the executable bit, which Compress-Archive would drop.
        run: zip -r -X "$NAME.zip" "$NAME"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: publish
        run: Compress-Archive -Path "$env:NAME" -DestinationPath "$env:NAME.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.rid }}
          path: publish/${{ env.NAME }}.zip
          if-no-files-found: error

  nuget:
    name: Publish to nuget.org
    needs: [build, server]
    runs-on: ubuntu-latest
    # The trusted publishing policy on nuget.org names this repository, this workflow file and
    # this environment; add required reviewers to the environment to approve each release.
    environment: nuget
    permissions:
      id-token: write   # the OIDC token nuget.org trades for a short-lived API key
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # No stored API key: the key this returns is valid for about an hour and for this push only.
      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Symbol packages (.snupkg) next to each .nupkg are pushed with it. --skip-duplicate lets
      # a re-run finish a release that failed halfway.
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: GitHub release
    needs: [build, server, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Checksums
        working-directory: dist
        run: sha256sum *.nupkg *.zip > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/*.nupkg dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Thunder.Dbf $VERSION" \
            --notes-file notes/release-notes.md "${prerelease[@]}"
