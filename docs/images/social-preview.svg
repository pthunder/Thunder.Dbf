<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- ProjectThunder :: Thunder.Dbf social preview (1280x640, GitHub's size) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#1a2c63"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset=".55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="160" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 39.5H160M159.5 0V40" stroke="#3b5bb5" stroke-opacity=".18" fill="none"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <!-- a dBASE BROWSE header row, faded -->
  <g font-family="Menlo, Consolas, monospace" font-size="18" fill="#7f9cf5" fill-opacity=".35">
    <text x="16" y="27">CONTACT</text><text x="176" y="27">COMPANY</text><text x="336" y="27">CITY</text>
    <text x="496" y="27">PHONE1</text><text x="656" y="27">LASTDATE</text><text x="816" y="27">KEY1</text>
    <text x="976" y="27">RECNO()</text><text x="1136" y="27">DELETED()</text>
  </g>
  <circle cx="300" cy="330" r="190" fill="#ffd23f" fill-opacity=".07"/>
  <circle cx="300" cy="330" r="150" fill="none" stroke="#ffd23f" stroke-opacity=".35" stroke-width="3"/>
  <path filter="url(#glow)" fill="url(#bolt)" stroke="#fff6c4" stroke-width="4" stroke-linejoin="round"
        d="M330 150 L210 350 L290 350 L262 512 L398 290 L316 290 L352 150 Z"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="540" y="290" font-size="104" font-weight="800" letter-spacing="-2">Thunder<tspan fill="#ffd23f">.</tspan>Dbf</text>
    <text x="544" y="350" font-size="31" fill="#c9d6ff">Safe, modern apps on legacy dBASE and</text>
    <text x="544" y="390" font-size="31" fill="#c9d6ff">FoxPro data, while the old app keeps running.</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="19">
    <rect x="544" y="430" width="316" height="44" rx="22" fill="#ffd23f" fill-opacity=".14" stroke="#ffd23f" stroke-opacity=".6"/>
    <text x="702" y="458" text-anchor="middle" fill="#ffe680">dBASE · FoxPro · Clipper</text>
    <rect x="874" y="430" width="350" height="44" rx="22" fill="#7f9cf5" fill-opacity=".14" stroke="#7f9cf5" stroke-opacity=".6"/>
    <text x="1049" y="458" text-anchor="middle" fill="#c9d6ff">.NET 10 · Win · Linux · Mac</text>
  </g>
  <text x="1240" y="606" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22"
        fill="#8fa3d9">a <tspan font-weight="700" fill="#ffffff">ProjectThunder</tspan> joint</text>
</svg>
